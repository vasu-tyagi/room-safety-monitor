# Slice 1 infrastructure for the six-layer rebuild.
# Brings up the three backing services the later slices depend on:
#   - Postgres + pgvector  (L5 incidents, audit, and the KB vector store)
#   - MinIO                (L5 evidence clip storage)
#   - Redis                (queues / pre-incident buffer coordination)
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
name: room-safety-monitor

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: room_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d room_safety"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rsm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    # No healthcheck: the minio image ships without curl/mc, so the common
    # HTTP healthcheck would report false failures. Readiness is checked by
    # the application client when MinIO is wired in (Slice 5).

  redis:
    image: redis:7-alpine
    container_name: rsm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ../services/dashboard
      dockerfile: Dockerfile
    container_name: rsm-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
  minio_data:
  redis_data:
